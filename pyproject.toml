[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitispray"
version = "0.1.0"
description = "Core library for Adaptive VitiSpray PFE"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vitispray*"]
